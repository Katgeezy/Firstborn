    <!DOCTYPE html>
    <html>
    <head>
        <title>TODAY</title>
        <link rel="stylesheet" href="styles.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>My Website for learning.</h1>
        <p>I am basically learning how to code.</p>
        <form action="results.html" method="Get" enctype="multipart/form-data">
            <div>
             <label for="name">Name:</label>
             <input type="text" name="name" id="name" placeholder="username" required>
            </div>
            <div class="blue">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="email@example.com" required>
            </div>
            <div>
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" min="1" max="150" step="1" required>
            </div>
            <div>
                <label for="date">Birthdate:</label>
                <input type="date" name="date" id="date" min="2019-12-01">
            </div>
        
            Are you married?
            <div>
                <label for="yes">Yes</label>
                <input type="checkbox" name="yes" id="yes">
                <label for="no">No</label>
                <input type="checkbox" name="no" id="no">

            </div>

            Gender
            <div>
                <label for="male">Male</label>
                <input type="radio" name="gender" id="male" value="male">
            </div>
            <div>
                <label for="female">Female</label>
                <input type="radio" name="gender" id="female" value="male">
            </div>

            <div>
                <label for="haircolour">Hair Colour:</label>
                <select name="haircolour" id="haircolour" multiple>
                    <option value="black">Black</option>
                    <option label="Red" value="Red"></option>
                </select>
            </div>
            <div>
                <label for="bio">Bio:</label>
                <textarea name="bio" id="bio"></textarea>
            </div>
            <div>
                <input type="hidden" name="hidden" id="hidden" value="goodmorning">
            </div>
            <div>
                <label for ="file">File</label>
                <input type="file" name="file" id="file">
            </div>
            <div>
                <label for="phone">Phone:</label>
                <input type="tel" name="phone" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
            </div>
            <div>
                <label for="url">Url:</label>
                <input type="url" name="url" id="url" placeholder="https://example.com">
            </div>
            <div>
                <label for="color">Colour:</label>
                <input type="color" name="color" id="color">


            <div>
             <label for="password">Password:</label>
             <input type="password" name="password" placeholder="password" required>
            </div>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
    </body>
    </html>
